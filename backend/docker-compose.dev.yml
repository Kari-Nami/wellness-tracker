services:
  mongo:
    image: mongo:8.2
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mongo_dev_data:
