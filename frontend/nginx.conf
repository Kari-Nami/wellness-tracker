server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/security-headers.conf;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location /api/ { return 404; }
    location /assets/ { try_files $uri =404; include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache"; }
}
